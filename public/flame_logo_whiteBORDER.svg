      <stop offset="60%" stopColor="#ff9900" />
      <stop offset="100%" stopColor="#ffdd6b" />
    </linearGradient>
    <linearGradient id="darkBannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
