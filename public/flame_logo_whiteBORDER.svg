      <stop offset="45%" stopColor="#e61616" />
      <stop offset="78%" stopColor="#b30c14" />
      <stop offset="100%" stopColor="#690408" />
    </radialGradient>
    <radialGradient id="topSheen" cx="50%" cy="15%" r="50%">
