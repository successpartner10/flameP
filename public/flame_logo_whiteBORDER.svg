      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      letter-spacing="2"
      stroke="#101214"
      stroke-width="2.5"
      paint-order="stroke fill"
    >
      FLAME
    </text>

    <line x1="8" y1="158" x2="252" y2="158" stroke="#ffffff" stroke-width="2.5" />
    <rect x="10" y="159.5" width="240" height="25" fill="url(#darkBannerGrad)" />
    <line x1="8" y1="185.5" x2="252" y2="185.5" stroke="#ffffff" stroke-width="2.5" />
    
    <text
