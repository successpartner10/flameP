      fill="url(#mainFlameGrad)"
    />
    <path d="M 40 150 C 44 125 56 100 70 112 C 78 119 78 132 84 140 C 76 132 68 130 64 145 Z" fill="#fff5a0" opacity="0.9" />
    <path d="M 78 145 C 84 115 100 90 115 105 C 122 112 120 125 126 138 C 118 126 108 122 102 142 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 125 140 C 135 105 152 75 170 95 C 180 106 180 120 188 135 C 178 122 168 116 160 138 Z" fill="#ffffff" />
    <path d="M 175 140 C 185 110 202 92 216 112 C 224 124 222 135 228 148 C 220 136 212 132 205 145 Z" fill="#fff5a0" opacity="0.9" />
    <path d="M 68 95 C 75 82 86 78 92 90 C 86 86 78 88 74 96 Z" fill="#fff9c4" />
    <path d="M 118 75 C 126 60 140 54 148 68 C 140 64 130 66 126 76 Z" fill="#ffffff" />
    <path d="M 168 60 C 178 42 196 35 206 54 C 196 48 184 50 178 62 Z" fill="#ffffff" />
    <path d="M 204 80 C 212 68 222 66 226 78 C 220 74 214 76 210 82 Z" fill="#fff9c4" />

